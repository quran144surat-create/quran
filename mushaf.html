<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E4A3B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mushaf</title>
<style>
:root{--bg:#F2F1E7;--surface:#FBFAF4;--ink:#10231D;--muted:#586C63;--line:#DBDED0;--primary:#0E4A3B;--on:#F8F5E8;--gold:#EDE1BC;--goldink:#7A5D12}
@media(prefers-color-scheme:dark){:root{--bg:#0A1512;--surface:#101F1A;--ink:#ECE8D8;--muted:#9DB0A6;--line:#203429;--primary:#1F7A60;--on:#F4F1E4;--gold:#3A3219;--goldink:#D9B96B}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,select{font:600 13.5px system-ui,sans-serif;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 12px}
h1{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header select{min-width:0;max-width:30vw;padding:9px 6px}
.pill{background:var(--gold);color:var(--goldink);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600}
#bmbtn{flex:none;padding:8px;display:grid;place-items:center}
#bmbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;display:block}
#bmbtn.on{color:var(--goldink);border-color:var(--gold);background:var(--gold)}
#bmbtn.on svg{fill:var(--goldink);stroke:var(--goldink)}
/* Bilah disembunyikan; muncul saat layar diketuk */
header,#bot{position:fixed;left:0;right:0;z-index:5;background:var(--surface);opacity:0;pointer-events:none;transition:transform .22s ease,opacity .22s ease}
header{top:0;transform:translateY(-100%);display:flex;direction:rtl;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
#bot{bottom:0;transform:translateY(100%);border-top:1px solid var(--line)}
#ind{text-align:center;font-size:12.5px;font-weight:600;color:var(--muted);padding:5px 0 calc(5px + env(safe-area-inset-bottom,0px))}
body.ui header,body.ui #bot{transform:none;opacity:1;pointer-events:auto}
#track{position:fixed;inset:0;display:flex;direction:rtl;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
#track::-webkit-scrollbar{display:none}
.pg{background:#FDFCF5;flex:0 0 100%;width:100%;height:100%;position:relative;scroll-snap-align:center;scroll-snap-stop:always;display:flex;direction:rtl;text-align:center;color:var(--muted);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.h{flex:1 1 0;min-width:0;height:100%;display:flex;align-items:center;justify-content:center}
.h img{width:auto;height:100%;max-width:100%;object-fit:contain;-webkit-mask-image:linear-gradient(90deg,transparent,#000 2.5%,#000 97.5%,transparent);mask-image:linear-gradient(90deg,transparent,#000 2.5%,#000 97.5%,transparent)}
.sp::after{content:"";position:absolute;top:0;bottom:0;left:calc(50% - min(9vw,130px));width:min(18vw,260px);pointer-events:none;background:linear-gradient(90deg,transparent,rgba(0,0,0,.16) 50%,transparent)}
.msg{max-width:340px;padding:0 16px;direction:ltr}
#homebtn{flex:none;padding:8px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}
#homebtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
#dlbtn{flex:none;padding:8px;display:grid;place-items:center}
#dlbtn[hidden]{display:none}
#dlbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
#dlbox{position:fixed;z-index:6;left:12px;right:12px;top:calc(62px + env(safe-area-inset-top,0px));max-width:360px;margin-inline:auto;direction:ltr;text-align:left;display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#dlbox[hidden],body:not(.ui) #dlbox{display:none}
#dlbar{width:100%;accent-color:var(--primary)}
#dlgo{background:var(--primary);color:var(--on);border-color:var(--primary)}

/* Perekam bacaan: ada di bilah bawah (muncul saat layar diketuk), jadi tidak pernah menimpa gambar halaman */
#rc{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 8px;padding:8px 10px 2px;direction:ltr}
.rb{width:40px;height:40px;padding:0;border-radius:50%;display:grid;place-items:center}
.rb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
#rfab{width:48px;height:48px;background:var(--primary);color:var(--on);border-color:var(--primary);transition:box-shadow .08s linear}
#rfab svg{width:24px;height:24px}
#rfab.rec{background:#C0392B;border-color:#C0392B;box-shadow:0 0 0 calc(var(--lv,0)*10px) rgba(192,57,43,.35)}
#rt{order:-1;flex:0 0 100%;text-align:center;font:600 13px system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink)}
#rtools{display:flex;gap:8px}
#rt[hidden],#rtools[hidden]{display:none}
#reye{display:none} /* tombol mata sudah ada di bilah atas */
/* Sembunyikan halaman (murojaah tanpa melihat) */
body.hid .h{visibility:hidden}
#hbtn{flex:none;padding:8px;display:grid;place-items:center}
#hbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
#hbtn.on,#reye.on{color:var(--goldink);border-color:var(--gold);background:var(--gold)}
#hbtn,#reye{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
#rg{display:flex;align-items:center;height:40px;padding:0 2px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:99px}
#rg button{width:34px;height:34px;padding:0;border:0;border-radius:50%;background:transparent;color:inherit;box-shadow:none;font:700 18px/1 system-ui,sans-serif}
#rg button:disabled{opacity:.3}
#rgain{min-width:34px;text-align:center;font:700 13px system-ui,sans-serif;font-variant-numeric:tabular-nums}
#rnr{font:700 10px/1.15 system-ui,sans-serif}
#rnr.on{color:var(--goldink);border-color:var(--gold);background:var(--gold)}
#rfab:disabled{opacity:.6}

/* Murattal: kotak ayat di atas gambar, pemutar mengambang, pengaturan ulang & rentang */
.h{position:relative}
.ao{position:absolute;pointer-events:none;direction:ltr}
.ao i{position:absolute;border-radius:5px;pointer-events:none}
body.aud .ao i{pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:rgba(214,170,40,.3)}
.ao i.on{background:rgba(214,170,40,.36)}
#abtn{flex:none;padding:8px;display:grid;place-items:center}
#abtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
#abtn.on{color:var(--goldink);border-color:var(--gold);background:var(--gold)}
#ap{position:fixed;z-index:4;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:none;flex-direction:column;align-items:center;gap:8px;direction:ltr;pointer-events:none;transition:bottom .22s ease}
body.aud #ap{display:flex}
body.ui #ap{bottom:calc(var(--bh,96px) + 10px)}
#ap>*{pointer-events:auto}
#apb{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 6px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:calc(100vw - 16px)}
#apb .rb{flex:none}
#aplay{background:var(--primary);color:var(--on);border-color:var(--primary)}
#aopt.on{color:var(--goldink);border-color:var(--gold);background:var(--gold)}
#alb{min-width:84px;max-width:38vw;padding:0 6px;text-align:center;font:600 12.5px system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#aset{width:min(360px,calc(100vw - 16px));display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);text-align:left}
#aset[hidden],#arb[hidden],#at[hidden]{display:none}
#aset .al{font:600 12.5px system-ui,sans-serif;color:var(--muted)}
#aset .sw{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:13.5px}
#aset .sw input{width:18px;height:18px;accent-color:var(--primary)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 4px}
.seg button.on{background:var(--primary);color:var(--on);border-color:var(--primary)}
#arb{display:grid;gap:6px}
.ar{display:grid;grid-template-columns:1fr 84px;gap:6px}
.ar select{min-width:0;max-width:none;width:100%}
#at{background:var(--ink);color:var(--bg);border-radius:99px;padding:7px 14px;font:600 12.5px system-ui,sans-serif;max-width:calc(100vw - 24px);text-align:center}
</style></head><body>
<header>
  <a id="homebtn" href="index.html" aria-label="Kembali ke halaman awal"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5 10v10h5v-6h4v6h5V10"/></svg></a>
  <h1 id="ttl">Juz 1</h1><span class="pill" id="info" hidden></span>
  <button id="bmbtn" aria-label="Tandai halaman ini"><svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></svg></button>
  <button id="hbtn"></button>
  <button id="abtn" aria-label="Murattal" aria-pressed="false"></button>
  <button id="dlbtn" aria-label="Simpan untuk offline"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg></button>
  <select id="jsel" aria-label="Juz"></select>
  <select id="ssel" aria-label="Surat"></select>
  <select id="sel" aria-label="Halaman"></select>
</header>
<main id="track"></main>

<div id="dlbox" hidden><div id="dltxt">Memeriksa…</div><progress id="dlbar" value="0"></progress><button id="dlgo">Unduh semua halaman</button></div>
<div id="bot"><div id="rc"><button id="rfab" class="rb" aria-label="Rekam bacaan"></button><button id="reye" class="rb"></button><div id="rg" role="group" aria-label="Penguatan suara"><button id="rgm" aria-label="Kurangi penguatan">−</button><span id="rgain" aria-live="polite"></span><button id="rgp" aria-label="Tambah penguatan">+</button></div><button id="rnr" class="rb" aria-label="Peredam bising"></button><span id="rt" hidden></span>
<div id="rtools" hidden><button id="rplay" class="rb" aria-label="Putar rekaman"></button><button id="rredo" class="rb" aria-label="Rekam ulang"></button><button id="rdl" class="rb" aria-label="Unduh rekaman"></button><button id="rdel" class="rb" aria-label="Hapus rekaman"></button></div></div><div id="ind"></div></div>
<div id="ap">
  <div id="at" hidden role="status"></div>
  <div id="aset" hidden>
    <div class="al">Ulangi tiap ayat</div>
    <div class="seg" id="arep"><button data-r="1">1&times;</button><button data-r="2">2&times;</button><button data-r="3">3&times;</button><button data-r="0">Tanpa batas</button></div>
    <label class="sw"><input type="checkbox" id="arng"> Atur rentang ayat</label>
    <div id="arb" hidden>
      <div class="al">Mulai</div><div class="ar"><select id="rs_s" aria-label="Surat mulai"></select><select id="rs_a" aria-label="Ayat mulai"></select></div>
      <div class="al">Selesai</div><div class="ar"><select id="re_s" aria-label="Surat selesai"></select><select id="re_a" aria-label="Ayat selesai"></select></div>
      <button id="apg">Isi dari halaman ini</button>
    </div>
  </div>
  <div id="apb">
    <button id="aprev" class="rb" aria-label="Ayat sebelumnya"></button>
    <button id="aplay" class="rb" aria-label="Putar murattal"></button>
    <button id="anext" class="rb" aria-label="Ayat berikutnya"></button>
    <button id="astop" class="rb" aria-label="Berhenti"></button>
    <span id="alb">Murattal</span>
    <button id="aopt" class="rb" aria-label="Pengaturan murattal"></button>
  </div>
</div>
<script src="config.js"></script>
<script>
const C=CFG,$=id=>document.getElementById(id),T=C.total,src=C.src;
const juzOf=p=>{for(let j=29;j>=0;j--)if(p>=C.juzStart[j])return j+1;return 1};
function pageOfAyah(s,a){
  const g=C.ay.slice(0,s-1).reduce((x,y)=>x+y,0)+a;let lo=0,hi=T-1;
  while(lo<hi){const m=(lo+hi+1)>>1;if(C.ps[m]<=g)lo=m;else hi=m-1}
  return lo+1;
}
const q=new URLSearchParams(location.search),s=+q.get('s'),a=+q.get('a');
const ayahPage=s&&a?pageOfAyah(s,a):0;
let cur=Math.min(Math.max(ayahPage||+q.get('p')||1,1),T);
if(ayahPage){$('info').textContent='QS '+s+':'+a;$('info').hidden=false}
const SN="Al-Fatihah|Al-Baqarah|Ali 'Imran|An-Nisa'|Al-Ma'idah|Al-An'am|Al-A'raf|Al-Anfal|At-Taubah|Yunus|Hud|Yusuf|Ar-Ra'd|Ibrahim|Al-Hijr|An-Nahl|Al-Isra'|Al-Kahfi|Maryam|Taha|Al-Anbiya'|Al-Hajj|Al-Mu'minun|An-Nur|Al-Furqan|Asy-Syu'ara'|An-Naml|Al-Qasas|Al-'Ankabut|Ar-Rum|Luqman|As-Sajdah|Al-Ahzab|Saba'|Fatir|Yasin|As-Saffat|Sad|Az-Zumar|Gafir|Fussilat|Asy-Syura|Az-Zukhruf|Ad-Dukhan|Al-Jasiyah|Al-Ahqaf|Muhammad|Al-Fath|Al-Hujurat|Qaf|Az-Zariyat|At-Tur|An-Najm|Al-Qamar|Ar-Rahman|Al-Waqi'ah|Al-Hadid|Al-Mujadalah|Al-Hasyr|Al-Mumtahanah|As-Saff|Al-Jumu'ah|Al-Munafiqun|At-Tagabun|At-Talaq|At-Tahrim|Al-Mulk|Al-Qalam|Al-Haqqah|Al-Ma'arij|Nuh|Al-Jinn|Al-Muzzammil|Al-Muddassir|Al-Qiyamah|Al-Insan|Al-Mursalat|An-Naba'|An-Nazi'at|'Abasa|At-Takwir|Al-Infitar|Al-Mutaffifin|Al-Insyiqaq|Al-Buruj|At-Tariq|Al-A'la|Al-Gasyiyah|Al-Fajr|Al-Balad|Asy-Syams|Al-Lail|Ad-Duha|Asy-Syarh|At-Tin|Al-'Alaq|Al-Qadr|Al-Bayyinah|Az-Zalzalah|Al-'Adiyat|Al-Qari'ah|At-Takasur|Al-'Asr|Al-Humazah|Al-Fil|Quraisy|Al-Ma'un|Al-Kausar|Al-Kafirun|An-Nasr|Al-Lahab|Al-Ikhlas|Al-Falaq|An-Nas".split('|');
// cum[i] = jumlah ayat sebelum surat ke-(i+1); dipakai memetakan nomor ayat global -> surat
const cum=[];C.ay.reduce((x,y,i)=>(cum[i]=x,x+y),0);
const TA=C.ay.reduce((x,y)=>x+y,0);
const surahOf=g=>{let lo=0,hi=C.ay.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(cum[m]<g)lo=m;else hi=m-1}return lo+1};
for(let j=1;j<=30;j++)$('jsel').add(new Option('Juz '+j,j));
SN.forEach((n,i)=>$('ssel').add(new Option((i+1)+'. '+n,i+1)));
for(let i=1;i<=T;i++)$('sel').add(new Option('Hal. '+i,i));

const track=$('track'),mq=matchMedia('(orientation:landscape)');
let spread=mq.matches,cells={},loaded=new Set(),loadObs,curObs;
const start=n=>spread?(n%2?n:n-1):n;

function loadImg(h){
  if(h.dataset.done)return;h.dataset.done=1;loaded.add(h);const n=+h.dataset.p;
  const im=new Image();im.alt='Halaman '+n;im.addEventListener('load',()=>window.audOv&&audOv(h,im));
  im.onerror=()=>{h.innerHTML='<div class="msg">Gambar halaman '+n+' tidak ditemukan.<br>Yang dicari: <code dir="ltr">'+src(n)+'</code><br>Cocokkan nama folder dan file di repo dengan <code dir="ltr">config.js</code>, atau kalau sedang offline, halaman ini belum tersimpan di perangkat</div>'};
  const u=src(n);try{if(new URL(u,location.href).origin!==location.origin)im.crossOrigin='anonymous'}catch(e){}
  im.src=u;h.appendChild(im);
}
// buang gambar yang sudah jauh dari halaman aktif supaya memori tidak menumpuk
function unloadFar(){loaded.forEach(h=>{if(Math.abs(+h.dataset.p-cur)>12){h.replaceChildren();delete h.dataset.done;loaded.delete(h)}})}
// Penanda (bookmark) & posisi terakhir dibaca — disimpan di localStorage,
// dipakai bersama oleh index.html (tab PENANDA, tombol "Lanjut membaca").
const bm=()=>{try{return JSON.parse(localStorage.getItem('quran.bm')||'[]')}catch(e){return[]}};
const saveBm=a=>{try{localStorage.setItem('quran.bm',JSON.stringify(a))}catch(e){}};
function syncBm(n){$('bmbtn').classList.toggle('on',bm().includes(n))}
$('bmbtn').onclick=()=>{
  const a=bm(),i=a.indexOf(cur);
  if(i>-1)a.splice(i,1);else a.push(cur);
  saveBm(a);syncBm(cur);
};
function setCur(n){
  cur=n;$('sel').value=n;
  const j=juzOf(n);$('jsel').value=j;$('ttl').textContent='Juz '+j;
  // surat yang tampil di halaman aktif; pilihan pengguna dipertahankan bila masih ada di halaman ini
  const e=spread&&n<T?n+1:n,s1=surahOf(C.ps[n-1]),s2=surahOf(e<T?C.ps[e]-1:TA),sv=+$('ssel').value;
  $('ssel').value=(sv>=s1&&sv<=s2)?sv:s1;
  $('ind').textContent='Hal. '+(spread&&n<T?n+'–'+(n+1):n)+' / '+T;
  const hasAyah=ayahPage&&(ayahPage===n||(spread&&ayahPage===n+1));
  history.replaceState(null,'','?p='+n+(hasAyah?'&s='+s+'&a='+a:''));
  try{localStorage.setItem('quran.last',n)}catch(e){}
  syncBm(n);
  window.recSync&&recSync(n);
  unloadFar();
}
function goto(n,smooth){
  const c=cells[start(n)];
  if(c)c.scrollIntoView({behavior:smooth?'smooth':'instant',inline:'center',block:'nearest'});
}
// Urutan DOM = urutan baca Arab (direction:rtl): elemen pertama ada di paling KANAN.
// Mode 2 halaman: ganjil di kanan, genap di kiri (1|2, 3|4, ...).
function build(){
  loadObs&&loadObs.disconnect();curObs&&curObs.disconnect();
  track.replaceChildren();cells={};loaded.clear();
  const step=spread?2:1,frag=document.createDocumentFragment();
  for(let i=1;i<=T;i+=step){
    const d=document.createElement('div');d.className='pg';d.dataset.p=i;
    // potret: 1 gambar = 1 halaman; landscape: 1 gambar (i,i+1) sudah berisi 2 halaman
    const h=document.createElement('div');h.className='h';h.dataset.p=i;d.appendChild(h);
    cells[i]=d;frag.appendChild(d);
  }
  track.appendChild(frag);
  loadObs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.querySelectorAll('.h').forEach(loadImg)}),{root:track,rootMargin:'0px 100% 0px 100%'});
  curObs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setCur(+e.target.dataset.p)}),{root:track,threshold:0.6});
  const c=start(cur);
  cells[c].querySelectorAll('.h').forEach(loadImg);
  setCur(c);goto(c,false);
  for(const k in cells){loadObs.observe(cells[k]);curObs.observe(cells[k])}
  requestAnimationFrame(()=>goto(cur,false));
}
build();
mq.addEventListener('change',()=>{spread=mq.matches;build()});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>goto(cur,false),150)});

$('sel').onchange=e=>goto(+e.target.value,false);
$('jsel').onchange=e=>goto(C.juzStart[+e.target.value-1],false);
$('ssel').onchange=e=>goto(pageOfAyah(+e.target.value,1),false);

// Ketuk layar -> tampilkan/sembunyikan bilah. Geser halaman tidak memicu ketukan.
let firstTap=true;
track.addEventListener('click',e=>{
  if(e.target.closest('button,select'))return;
  document.body.classList.toggle('ui');
  if(firstTap&&matchMedia('(pointer:coarse)').matches&&document.fullscreenEnabled&&!document.fullscreenElement)
    document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
  firstTap=false;
});
// Panah keyboard: kiri = berikutnya (searah mushaf Arab)
addEventListener('keydown',e=>{
  const st=spread?2:1;
  if(e.key==='ArrowLeft'&&cur+st<=T)goto(cur+st,true);
  if(e.key==='ArrowRight'&&cur-st>=1)goto(cur-st,true);
});
if(location.protocol.startsWith('http')&&navigator.serviceWorker)navigator.serviceWorker.register('sw.js');

// Simpan semua gambar untuk offline (Cache API, bukan localStorage).
// Cache 'mushaf-v1' dan alamat gambar sama dengan Kuis Murojaah v3, jadi unduhan di salah satu app terlihat di app satunya.
(()=>{
  const dlb=$('dlbtn'),box=$('dlbox'),bar=$('dlbar'),txt=$('dltxt'),gob=$('dlgo');
  if(!window.caches||!location.protocol.startsWith('http')){dlb.hidden=true;return}
  const CN='mushaf-v1';

  const[s,a]=sa(g);
  try{navigator.mediaSession.metadata=new MediaMetadata({title:SN[s-1]+' : '+a,artist:'Syeikh Muhammad Ayyub',album:'Murattal'})}catch(e){}
}
function warmNext(){if(g<endG())warm.src=url(g+1)}
function load(n){
  g=n;rep=0;act=true;A.loop=S.rep===0;A.src=url(g);
  A.play().catch(e=>{if(e&&e.name!=='AbortError'){toast('Audio tidak bisa diputar');paintPlay()}});
  mark();follow();label();meta();paintPlay();warmNext();
}
function halt(){
  if(!act)return;
  act=false;g=0;A.pause();A.removeAttribute('src');A.load();
  mark();label();paintPlay();
}
window.audHalt=halt;
A.onplay=A.onpause=paintPlay;
A.onerror=()=>{if(act){toast('Audio tidak dapat dimuat. Periksa koneksi internet.');paintPlay()}};
A.onended=()=>{
  rep++;
  if(S.rep===0||rep<S.rep){label();A.currentTime=0;A.play().catch(()=>{});return}
  if(g>=endG()){halt();return}
  load(g+1);
};
function firstHere(){return C.ps[cur-1]||1}
function tap(k){
  const[s,a]=k.split(':').map(Number),n=gk(s,a);
  if(recording()){toast('Hentikan rekaman dulu');return}
  if(S.rng&&(n<S.rs||n>S.re)){toast('Ayat ini di luar rentang. Ubah rentang di pengaturan.');return}
  load(n);
}
$('aplay').onclick=()=>{
  if(recording()){toast('Hentikan rekaman dulu');return}
  if(!act)load(S.rng?S.rs:firstHere());
  else A.paused?A.play().catch(()=>{}):A.pause();
};
$('aprev').onclick=()=>{if(act)load(Math.max(begG(),g-1))};
$('anext').onclick=()=>{if(!act)return;g<endG()?load(g+1):halt()};
$('astop').onclick=halt;
if('mediaSession' in navigator){
  const ms=(n,f)=>{try{navigator.mediaSession.setActionHandler(n,f)}catch(e){}};
  ms('play',()=>{act&&A.play().catch(()=>{})});ms('pause',()=>{A.pause()});
  ms('previoustrack',()=>$('aprev').click());ms('nexttrack',()=>$('anext').click());ms('stop',halt);
}

// ---------- kotak ayat di atas gambar ----------
const pr={};
const getBoxes=m=>pr[m]||(pr[m]=fetch('ayah-boxes-'+m+'.json').then(r=>r.ok?r.json():{}).catch(()=>({})));
function place(h){
  const o=h.__o;if(!o||!o.im.isConnected||!o.im.naturalWidth)return;
  const hb=h.getBoundingClientRect(),ib=o.im.getBoundingClientRect(),nw=o.im.naturalWidth,nh=o.im.naturalHeight;
  const sc=Math.min(ib.width/nw,ib.height/nh),cw=nw*sc,ch=nh*sc,st=o.ov.style;
  st.left=(ib.left-hb.left+(ib.width-cw)/2)+'px';st.top=(ib.top-hb.top+(ib.height-ch)/2)+'px';
  st.width=cw+'px';st.height=ch+'px';
}
const ro=window.ResizeObserver?new ResizeObserver(es=>es.forEach(e=>place(e.target))):null;
window.audOv=async(h,im)=>{
  const B=(await getBoxes(spread?'L':'P'))[String(h.dataset.p)];
  if(!B||!im.isConnected)return;
  const old=h.querySelector('.ao');if(old)old.remove();
  const ov=document.createElement('div');ov.className='ao';
  const now=act&&g?sa(g).join(':'):'';
  for(const k in B)for(const r of B[k]){
    const i=document.createElement('i');i.dataset.k=k;
    i.style.cssText='left:'+r[0]+'%;top:'+r[1]+'%;width:'+r[2]+'%;height:'+r[3]+'%';
    if(k===now)i.className='on';
    ov.appendChild(i);
  }
  h.appendChild(ov);h.__o={ov,im};place(h);ro&&ro.observe(h);
};
// fase capture: ketukan pada ayat memutar audio dan tidak ikut memunculkan/menyembunyikan bilah
$('track').addEventListener('click',e=>{
  if(!document.body.classList.contains('aud'))return;
  const i=e.target.closest&&e.target.closest('.ao i');if(!i)return;
  e.stopPropagation();tap(i.dataset.k);
},true);

// ---------- pengaturan ----------
const rsS=$('rs_s'),rsA=$('rs_a'),reS=$('re_s'),reA=$('re_a');
SN.forEach((n,i)=>{rsS.add(new Option((i+1)+'. '+n,i+1));reS.add(new Option((i+1)+'. '+n,i+1))});
function fillA(sel,s){const n=C.ay[s-1];if(sel.options.length!==n){sel.replaceChildren();for(let a=1;a<=n;a++)sel.add(new Option(a,a))}}
function paintRange(){
  const[s1,a1]=sa(S.rs),[s2,a2]=sa(S.re);
  rsS.value=s1;fillA(rsA,s1);rsA.value=a1;reS.value=s2;fillA(reA,s2);reA.value=a2;
  $('arng').checked=S.rng;$('arb').hidden=!S.rng;
}
function paintRep(){document.querySelectorAll('#arep button').forEach(b=>b.classList.toggle('on',+b.dataset.r===S.rep))}
function setRange(edit,g0){
  if(edit==='s'){S.rs=g0;if(S.re<S.rs)S.re=S.rs}else{S.re=g0;if(S.rs>S.re)S.rs=S.re}
  save();paintRange();
}
rsS.onchange=()=>setRange('s',gk(+rsS.value,1));
rsA.onchange=()=>setRange('s',gk(+rsS.value,+rsA.value));
reS.onchange=()=>setRange('e',gk(+reS.value,1));
reA.onchange=()=>setRange('e',gk(+reS.value,+reA.value));
$('arng').onchange=e=>{S.rng=e.target.checked;save();paintRange()};
$('apg').onclick=()=>{
  const nxt=(spread&&cur<T)?cur+1:cur;
  S.rs=C.ps[cur-1]||1;S.re=Math.max(S.rs,(nxt<T?C.ps[nxt]:TA+1)-1);S.rng=true;save();paintRange();
};
document.querySelectorAll('#arep button').forEach(b=>b.onclick=()=>{
  S.rep=+b.dataset.r;if(act){A.loop=S.rep===0;label()}save();paintRep();
});
$('aopt').onclick=()=>{const a=$('aset');a.hidden=!a.hidden;$('aopt').classList.toggle('on',!a.hidden)};

// ---------- mode murattal (tombol speaker di bilah atas) ----------
function applyMode(){
  document.body.classList.toggle('aud',S.on);
  $('abtn').classList.toggle('on',S.on);$('abtn').setAttribute('aria-pressed',S.on);
  if(!S.on){$('aset').hidden=true;$('aopt').classList.remove('on')}
}
$('abtn').onclick=()=>{S.on=!S.on;if(!S.on)halt();save();applyMode();if(S.on)toast('Ketuk ayat di halaman untuk memutar')};
// pemutar mengambang naik di atas bilah bawah saat bilah muncul
if(window.ResizeObserver){new ResizeObserver(()=>document.documentElement.style.setProperty('--bh',$('bot').offsetHeight+'px')).observe($('bot'))}
paintRange();paintRep();paintPlay();label();applyMode();
})();
</script></body></html>
