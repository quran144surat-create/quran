<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E4A3B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mushaf</title>
<style>
:root{--accent:#0E4A3B;--bg:#F2F1E7;--surface:#FBFAF4;--ink:#10231D;--muted:#586C63;--line:#DBDED0;--primary:#0E4A3B;--on:#F8F5E8;--gold:#EDE1BC;--goldink:#7A5D12}
@media(prefers-color-scheme:dark){:root{--accent:#5CC9A7;--bg:#0A1512;--surface:#101F1A;--ink:#ECE8D8;--muted:#9DB0A6;--line:#203429;--primary:#1F7A60;--on:#F4F1E4;--gold:#3A3219;--goldink:#D9B96B}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,select{font:600 13.5px system-ui,sans-serif;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 12px}
h1{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header select{min-width:0;max-width:30vw;padding:9px 6px}
.pill{background:var(--gold);color:var(--goldink);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600}
#bmbtn{flex:none;padding:8px;display:grid;place-items:center}
#bmbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;display:block}
#bmbtn.on{color:var(--goldink);border-color:var(--gold);background:var(--gold)}
#bmbtn.on svg{fill:var(--goldink);stroke:var(--goldink)}
/* Bilah disembunyikan; muncul saat layar diketuk */
header,#bot{position:fixed;left:0;right:0;z-index:5;background:var(--surface);opacity:0;pointer-events:none;transition:transform .22s ease,opacity .22s ease}
header{top:0;transform:translateY(-100%);display:flex;direction:rtl;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
#bot{bottom:0;transform:translateY(100%);border-top:1px solid var(--line)}
#ind{text-align:center;font-size:12.5px;font-weight:600;color:var(--muted);padding:5px 0 calc(5px + env(safe-area-inset-bottom,0px))}
body.ui header,body.ui #bot{transform:none;opacity:1;pointer-events:auto}
#track{position:fixed;inset:0;display:flex;direction:rtl;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain;overscroll-behavior-y:none;touch-action:pan-x pinch-zoom}
#track::-webkit-scrollbar{display:none}
.pg{background:#FDFCF5;flex:0 0 100%;width:100%;height:100%;position:relative;scroll-snap-align:center;scroll-snap-stop:always;display:flex;direction:rtl;text-align:center;color:var(--muted);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.h{flex:1 1 0;min-width:0;height:100%;display:flex;align-items:center;justify-content:center}
.h img{width:auto;height:100%;max-width:100%;object-fit:contain;-webkit-mask-image:linear-gradient(90deg,transparent,#000 2.5%,#000 97.5%,transparent);mask-image:linear-gradient(90deg,transparent,#000 2.5%,#000 97.5%,transparent)}
.msg{max-width:340px;padding:0 16px;direction:ltr}
#homebtn{flex:none;padding:8px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}
#homebtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
#dlbtn{flex:none;padding:8px;display:grid;place-items:center}
#dlbtn[hidden]{display:none}
#dlbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
/* Simpan offline: sheet bawah (muncul hanya saat dibuka, seperti pilihan qori), kisi 30 juz */
.dl{max-height:calc(100dvh - 24px);overflow:auto}
.dl-bar{display:flex;justify-content:flex-end;gap:16px;margin:-4px 0 -2px}
.lnk{border:0;background:none;padding:4px 2px;font:600 12.5px system-ui,sans-serif;color:var(--accent)}
.lnk:disabled{opacity:.4}
#jg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.jt{position:relative;height:46px;padding:0;overflow:hidden;border-radius:12px;font:700 16px system-ui,sans-serif;font-variant-numeric:tabular-nums;background-color:var(--surface);background-image:linear-gradient(to top,color-mix(in srgb,var(--primary) 26%,transparent) calc(var(--p,0)*100%),transparent 0)}
.jt.done{background:var(--primary);color:var(--on);border-color:var(--primary)}
.jt.done::after{content:"\2713";position:absolute;top:2px;right:6px;font-size:10px;opacity:.85}
.jt.sel{background-color:var(--gold);color:var(--goldink);border-color:var(--goldink);box-shadow:inset 0 0 0 1px var(--goldink)}
#dlleg{font:500 11.5px system-ui,sans-serif;color:var(--muted);text-align:center}
#dlprog{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
#dlprog[hidden]{display:none}
#dlprog i{display:block;height:100%;background:var(--primary);transform-origin:left;transform:scaleX(var(--v,0));transition:transform .2s}
#dltxt{font:600 12.5px system-ui,sans-serif;color:var(--muted);text-align:center;min-height:1.4em}
#dlgo{width:100%;padding:13px;font-size:15px;background:var(--primary);color:var(--on);border-color:var(--primary)}
#dlgo:disabled{opacity:.45}
@media(orientation:landscape) and (max-height:500px){#jg,#ajg{grid-template-columns:repeat(10,1fr)}}
#ajg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
#aprog{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
#aprog[hidden]{display:none}
#aprog i{display:block;height:100%;background:var(--primary);transform-origin:left;transform:scaleX(var(--v,0));transition:transform .2s}
#atxt{font:600 12.5px system-ui,sans-serif;color:var(--muted);text-align:center;min-height:1.4em}
#ago{width:100%;padding:13px;font-size:15px;background:var(--primary);color:var(--on);border-color:var(--primary)}
#ago:disabled{opacity:.45}

/* Perekam bacaan: ada di bilah bawah (muncul saat layar diketuk), jadi tidak pernah menimpa gambar halaman */
#rc{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 8px;padding:8px 10px 2px;direction:ltr}
.rb{width:40px;height:40px;padding:0;border-radius:50%;display:grid;place-items:center}
.rb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
#rfab{width:48px;height:48px;background:var(--primary);color:var(--on);border-color:var(--primary);transition:box-shadow .08s linear}
#rfab svg{width:24px;height:24px}
#rfab.rec{background:#C0392B;border-color:#C0392B;box-shadow:0 0 0 calc(var(--lv,0)*10px) rgba(192,57,43,.35)}
#rt{order:-1;flex:0 0 100%;text-align:center;font:600 13px system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink)}
#rtools{display:flex;gap:8px}
/* Kecerahan dalam app: lapisan gelap di atas halaman saja (bilah, sheet, dan tombol tidak ikut redup) */
#dim{position:fixed;inset:0;z-index:3;background:#000;opacity:0;pointer-events:none}
#bhud{position:fixed;z-index:9;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-6px);display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;background:var(--ink);color:var(--bg);font:600 12.5px system-ui,sans-serif;font-variant-numeric:tabular-nums;direction:ltr;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
#bhud.on{opacity:1;transform:translate(-50%,0)}
#bhud svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;flex:none}
#bhv{min-width:34px;text-align:right}
#bhb{position:relative;width:64px;height:4px;border-radius:2px;overflow:hidden;background:color-mix(in srgb,var(--bg) 30%,transparent)}
#bhb::after{content:"";position:absolute;inset:0;width:var(--v,100%);border-radius:2px;background:var(--bg)}
/* Pemutar rekaman: kartu tipis di bilah bawah; tetap tampil di halaman mana pun selama rekaman diputar */
#rp{margin:8px 10px 0;padding:8px 10px 6px;display:grid;gap:2px;direction:ltr;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--ink) 5%,transparent)}
#rp[hidden],body.pl #rp{display:none}
.rp1{display:flex;align-items:center;gap:8px}
#rplay{background:var(--primary);color:var(--on);border-color:var(--primary)}
#rplay:disabled{opacity:.6}
#rpc,#rpd{flex:none;min-width:34px;font:600 12px system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--muted)}
#rpc{text-align:right}
.rb.sm{width:32px;height:32px}
.rb.sm svg{width:16px;height:16px}
#rpx[hidden],#rpn[hidden]{display:none}
.rp2{display:flex;align-items:center;gap:12px;padding-left:2px;font:600 12px system-ui,sans-serif;color:var(--muted)}
.rp2 .sp{flex:1}
#rpl{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rps{flex:1;min-width:0;height:28px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;--v:0%}
#rps:focus{outline:none}
#rps::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--primary) var(--v),var(--line) 0)}
#rps::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
#rps::-moz-range-progress{height:4px;border-radius:2px;background:var(--primary)}
#rps::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:var(--primary);border:2px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.35)}
#rps::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--primary);border:2px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.35)}
#rt[hidden],#rtools[hidden]{display:none}
#reye{display:none} /* tombol mata sudah ada di bilah atas */
/* Sembunyikan halaman (murojaah tanpa melihat) */
body.hid .h{visibility:hidden}
#hbtn{flex:none;padding:8px;display:grid;place-items:center}
#hbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
#hbtn.on,#reye.on{color:var(--goldink);border-color:var(--gold);background:var(--gold)}
#hbtn,#reye{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
/* tekan lama pada halaman: tanpa menu salin/unduh/bagikan gambar bawaan browser */
#track,#track img,.ao i{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
#rg{display:flex;align-items:center;height:40px;padding:0 2px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:99px}
#rg button{width:34px;height:34px;padding:0;border:0;border-radius:50%;background:transparent;color:inherit;box-shadow:none;font:700 18px/1 system-ui,sans-serif}
#rg button:disabled{opacity:.3}
#rgain{min-width:34px;text-align:center;font:700 13px system-ui,sans-serif;font-variant-numeric:tabular-nums}
#rnr{font:700 10px/1.15 system-ui,sans-serif}
#rnr.on{color:var(--goldink);border-color:var(--gold);background:var(--gold)}
#rfab:disabled{opacity:.6}

/* Murattal: kotak ayat di atas gambar, pemutar mengambang, pengaturan ulang & rentang */
.h{position:relative}
.ao{position:absolute;pointer-events:none;direction:ltr}
.ao i{position:absolute;border-radius:5px;pointer-events:auto;-webkit-tap-highlight-color:transparent}
.ao i.on{background:rgba(214,170,40,.36)}
#abtn{flex:none;padding:8px;display:grid;place-items:center}
#abtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
#abtn.on{color:var(--goldink);border-color:var(--gold);background:var(--gold)}
#ap{display:none;flex-direction:column;align-items:center;gap:8px;direction:ltr;padding:8px 10px 0}
body.pl #ap{display:flex}
#apb{display:flex;align-items:center;justify-content:center;gap:2px;max-width:100%}
#apb .rb{flex:none}
#aplay{background:var(--primary);color:var(--on);border-color:var(--primary)}
#aopt.on{color:var(--goldink);border-color:var(--gold);background:var(--gold)}
#alb{min-width:84px;max-width:38vw;padding:0 6px;text-align:center;font:600 12.5px system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#aset{width:min(420px,100%);max-height:42vh;overflow:auto;display:grid;gap:8px;background:transparent;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left}
#aset[hidden],#arb[hidden],#at[hidden]{display:none}
#aset .al{font:600 12.5px system-ui,sans-serif;color:var(--muted)}
#aset .sw{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:13.5px}
#aset .sw input{width:18px;height:18px;accent-color:var(--primary)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 4px}
.seg button.on{background:var(--primary);color:var(--on);border-color:var(--primary)}
#arb{display:grid;gap:6px}
.ar{display:grid;grid-template-columns:1fr 84px;gap:6px}
.ar select{min-width:0;max-width:none;width:100%}
#at{background:var(--ink);color:var(--bg);border-radius:99px;padding:7px 14px;font:600 12.5px system-ui,sans-serif;max-width:calc(100vw - 24px);text-align:center}

/* ===== Gaya minimalis: halaman mushaf jadi bintang, kontrol disembunyikan sampai diketuk ===== */
header,#bot{background:color-mix(in srgb,var(--surface) 76%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5)}
header{gap:4px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);padding-top:calc(4px + env(safe-area-inset-top,0px));padding-bottom:4px}
#bot{border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
#homebtn,#bmbtn,#morebtn{flex:none;width:42px;height:42px;padding:0;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:var(--accent);box-shadow:none}
#homebtn svg,#bmbtn svg,#morebtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}
#bmbtn.on{color:var(--goldink);border:0;background:transparent}
#bmbtn.on svg{fill:var(--goldink);stroke:var(--goldink)}
#ttl{direction:ltr;flex:1;min-width:0;border:0;background:transparent;box-shadow:none;padding:8px 6px;font:700 16px system-ui,sans-serif;color:var(--ink);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ttl::after{content:"\25BE";color:var(--muted);margin-inline-start:6px;font-size:12px}
.rb{border:0;background:transparent;color:var(--accent)}
#rfab:disabled{opacity:.6}
/* menu ⋯ */
#menu{position:fixed;z-index:7;top:calc(52px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));min-width:236px;display:grid;padding:6px;direction:ltr;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.22)}
#menu[hidden],body:not(.ui) #menu{display:none}
#menu button{display:flex;align-items:center;gap:12px;width:100%;flex:none;padding:12px 12px;border:0;border-radius:10px;background:transparent;color:var(--ink);text-align:left;font:600 14px system-ui,sans-serif}
#menu button[hidden],#menu #reye{display:none}
#menu svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none;color:var(--accent)}
#menu button.on{color:var(--goldink);background:var(--gold)}
#menu button.on svg{color:var(--goldink)}
/* lembar bawah (navigasi & aksi ayat) */
.scrim{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;direction:ltr}
.scrim[hidden]{display:none}
.sheet{width:min(480px,100%);display:grid;gap:10px;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--surface);border-radius:18px 18px 0 0;text-align:left}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 2px}
.sh-t{display:flex;align-items:center;justify-content:space-between;gap:8px;font:700 16px system-ui,sans-serif}
.fld{display:grid;gap:4px;font:600 12.5px system-ui,sans-serif;color:var(--muted)}
.fld select{width:100%;padding:12px 10px;font-size:15px}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:13px 6px;border:0;border-radius:10px;background:transparent;color:var(--ink);text-align:left;font:600 15px system-ui,sans-serif}
.row svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;color:var(--accent)}
.row.on,.row.on svg{color:var(--goldink)}
/* bilah bawah: satu baris = pengaturan rekaman, nomor halaman, tombol rekam */
#rc{flex-wrap:nowrap;padding:6px 10px 0}
#rc:not(:has(#rt:not([hidden]),#rtools:not([hidden]))){display:none}
#rt{order:0;flex:none}
#rset{display:flex;justify-content:center;align-items:center;gap:12px;padding:8px 10px 0;direction:ltr}
#rset[hidden]{display:none}
#rg{border:0;background:color-mix(in srgb,var(--ink) 8%,transparent)}
#brow{display:flex;align-items:center;gap:6px;direction:ltr;padding:4px 10px calc(4px + env(safe-area-inset-bottom,0px))}
#brow #ind{flex:1;padding:0}
#rcfg.on{color:var(--goldink);background:var(--gold)}
/* toast murattal */
#at{position:fixed;z-index:9;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));pointer-events:none;width:max-content;direction:ltr}
body.ui #at{bottom:calc(var(--bh,96px) + 12px)}
#aq{font:600 12px system-ui,sans-serif;color:var(--muted)}
#ash{background:transparent;align-items:stretch;justify-content:stretch}
#apop{position:fixed;display:flex;background:var(--primary);color:var(--on);border-radius:12px;padding:4px;box-shadow:0 6px 20px rgba(0,0,0,.3);direction:ltr}
#apop::after{content:"";position:absolute;left:var(--ax,50%);bottom:-4px;width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg)}
#apop.dn::after{bottom:auto;top:-4px}
#apop button{display:grid;justify-items:center;gap:2px;width:60px;padding:8px 2px;border:0;border-radius:8px;background:transparent;color:inherit;box-shadow:none;font:600 11px system-ui,sans-serif}
#apop svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#apop button.on{color:var(--gold)}
.ao i.sel{background:rgba(70,140,160,.3)}
.row:disabled{opacity:.4}
#qst{font:600 12.5px system-ui,sans-serif;color:var(--muted);min-height:1em}
/* antarmuka bukan teks bacaan: jangan bisa diblok/disalin; pesan error gambar tetap bisa */
html,body{-webkit-tap-highlight-color:transparent}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.msg,.msg *{-webkit-user-select:text;user-select:text}
#track,button,a,select{touch-action:manipulation}
/* tombol kembali kecil (pengganti tombol kembali HP saat layar penuh); hanya tampil saat bilah disembunyikan */
#bk{position:fixed;z-index:4;left:max(8px,env(safe-area-inset-left,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));width:34px;height:34px;padding:0;display:grid;place-items:center;border:0;border-radius:50%;background:color-mix(in srgb,var(--surface) 60%,transparent);color:var(--accent);opacity:.55;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:none}
#bk:active{opacity:.9}
#bk svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;display:block}
body.ui #bk{display:none}
</style></head><body>
<header>
  <a id="homebtn" href="index.html" aria-label="Kembali ke halaman awal"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5 10v10h5v-6h4v6h5V10"/></svg></a>

<script src="config.js"></script>
<script>
const C=CFG,$=id=>document.getElementById(id),T=C.total,src=C.src;
const juzOf=p=>{for(let j=29;j>=0;j--)if(p>=C.juzStart[j])return j+1;return 1};
function pageOfAyah(s,a){
  const g=C.ay.slice(0,s-1).reduce((x,y)=>x+y,0)+a;let lo=0,hi=T-1;
  while(lo<hi){const m=(lo+hi+1)>>1;if(C.ps[m]<=g)lo=m;else hi=m-1}
  return lo+1;
}
const q=new URLSearchParams(location.search),s=+q.get('s'),a=+q.get('a');
const ayahPage=s&&a?pageOfAyah(s,a):0;
let cur=Math.min(Math.max(ayahPage||+q.get('p')||1,1),T);
if(ayahPage){$('info').textContent='QS '+s+':'+a;$('info').hidden=false}
const SN="Al-Fatihah|Al-Baqarah|Ali 'Imran|An-Nisa'|Al-Ma'idah|Al-An'am|Al-A'raf|Al-Anfal|At-Taubah|Yunus|Hud|Yusuf|Ar-Ra'd|Ibrahim|Al-Hijr|An-Nahl|Al-Isra'|Al-Kahfi|Maryam|Taha|Al-Anbiya'|Al-Hajj|Al-Mu'minun|An-Nur|Al-Furqan|Asy-Syu'ara'|An-Naml|Al-Qasas|Al-'Ankabut|Ar-Rum|Luqman|As-Sajdah|Al-Ahzab|Saba'|Fatir|Yasin|As-Saffat|Sad|Az-Zumar|Gafir|Fussilat|Asy-Syura|Az-Zukhruf|Ad-Dukhan|Al-Jasiyah|Al-Ahqaf|Muhammad|Al-Fath|Al-Hujurat|Qaf|Az-Zariyat|At-Tur|An-Najm|Al-Qamar|Ar-Rahman|Al-Waqi'ah|Al-Hadid|Al-Mujadalah|Al-Hasyr|Al-Mumtahanah|As-Saff|Al-Jumu'ah|Al-Munafiqun|At-Tagabun|At-Talaq|At-Tahrim|Al-Mulk|Al-Qalam|Al-Haqqah|Al-Ma'arij|Nuh|Al-Jinn|Al-Muzzammil|Al-Muddassir|Al-Qiyamah|Al-Insan|Al-Mursalat|An-Naba'|An-Nazi'at|'Abasa|At-Takwir|Al-Infitar|Al-Mutaffifin|Al-Insyiqaq|Al-Buruj|At-Tariq|Al-A'la|Al-Gasyiyah|Al-Fajr|Al-Balad|Asy-Syams|Al-Lail|Ad-Duha|Asy-Syarh|At-Tin|Al-'Alaq|Al-Qadr|Al-Bayyinah|Az-Zalzalah|Al-'Adiyat|Al-Qari'ah|At-Takasur|Al-'Asr|Al-Humazah|Al-Fil|Quraisy|Al-Ma'un|Al-Kausar|Al-Kafirun|An-Nasr|Al-Lahab|Al-Ikhlas|Al-Falaq|An-Nas".split('|');
// cum[i] = jumlah ayat sebelum surat ke-(i+1); dipakai memetakan nomor ayat global -> surat
const cum=[];C.ay.reduce((x,y,i)=>(cum[i]=x,x+y),0);
const TA=C.ay.reduce((x,y)=>x+y,0);
const surahOf=g=>{let lo=0,hi=C.ay.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(cum[m]<g)lo=m;else hi=m-1}return lo+1};
for(let j=1;j<=30;j++)$('jsel').add(new Option('Juz '+j,j));
SN.forEach((n,i)=>$('ssel').add(new Option((i+1)+'. '+n,i+1)));
for(let i=1;i<=T;i++)$('sel').add(new Option('Hal. '+i,i));

const track=$('track'),mq=matchMedia('(orientation:landscape)');
let spread=mq.matches,cells={},loaded=new Set(),loadObs,curObs,rz=false,curUrl=null,ftgt=0;
const start=n=>spread?(n%2?n:n-1):n;

function loadImg(h){
  if(h.dataset.done)return;h.dataset.done=1;loaded.add(h);const n=+h.dataset.p;
  const im=new Image();im.alt='Halaman '+n;im.addEventListener('load',()=>window.audOv&&audOv(h,im));
  im.onerror=()=>{if(!im.isConnected)return;h.innerHTML='<div class="msg">Gambar halaman '+n+' tidak ditemukan.<br>Yang dicari: <code dir="ltr">'+src(n)+'</code><br>Cocokkan nama folder dan file di repo dengan <code dir="ltr">config.js</code>, atau kalau sedang offline, halaman ini belum tersimpan di perangkat<br><br><button class="retry">Coba lagi</button></div>';h.querySelector('.retry').onclick=()=>{h.replaceChildren();delete h.dataset.done;loaded.delete(h);loadImg(h)}};
  const u=src(n);try{if(new URL(u,location.href).origin!==location.origin)im.crossOrigin='anonymous'}catch(e){}
  im.src=u;h.appendChild(im);
}
// buang gambar yang sudah jauh dari halaman aktif supaya memori tidak menumpuk
addEventListener('online',()=>[...loaded].forEach(h=>{const b=h.querySelector('.retry');b&&b.click()}));
function unloadFar(){loaded.forEach(h=>{if(Math.abs(+h.dataset.p-cur)>12){h.replaceChildren();delete h.dataset.done;loaded.delete(h)}})}
// Penanda (bookmark) & posisi terakhir dibaca — disimpan di localStorage,
// dipakai bersama oleh index.html (tab PENANDA, tombol "Lanjut membaca").
const bm=()=>{try{return JSON.parse(localStorage.getItem('quran.bm')||'[]')}catch(e){return[]}};
const saveBm=a=>{try{localStorage.setItem('quran.bm',JSON.stringify(a))}catch(e){}};
// mode 2 halaman: satu layar = dua halaman, jadi penanda dicek & dihapus untuk keduanya
const pgs=n=>spread&&n<T?[n,n+1]:[n];
const bmOn=n=>{const a=bm();return pgs(n).some(p=>a.includes(p))};
function syncBm(n){$('bmbtn').classList.toggle('on',bmOn(n))}
$('bmbtn').onclick=()=>{
  let a=bm();
  if(bmOn(cur)){const ps=pgs(cur);a=a.filter(p=>!ps.includes(p))}else a.push(cur);
  saveBm(a);syncBm(cur);
};
function setCur(n){
  cur=n;$('sel').value=n;
  const j=juzOf(n);$('jsel').value=j;
  // surat yang tampil di halaman aktif; pilihan pengguna dipertahankan bila masih ada di halaman ini
  const e=spread&&n<T?n+1:n,s1=surahOf(C.ps[n-1]),s2=surahOf(e<T?C.ps[e]-1:TA),sv=+$('ssel').value;
  $('ssel').value=(sv>=s1&&sv<=s2)?sv:s1;
  $('ttl').textContent='Juz '+j+' \u00b7 '+SN[+$('ssel').value-1];
  $('ind').textContent='Hal. '+(spread&&n<T?n+'–'+(n+1):n)+' / '+T;
  const hasAyah=ayahPage&&(ayahPage===n||(spread&&ayahPage===n+1));
  curUrl='?p='+n+(hasAyah?'&s='+s+'&a='+a:'');history.replaceState(null,'',curUrl);
  try{localStorage.setItem('quran.last',n)}catch(e){}
  syncBm(n);
  window.recSync&&recSync(n);
  unloadFar();
}
function goto(n,smooth){
  const c=cells[start(n)];
  if(c)c.scrollIntoView({behavior:smooth?'smooth':'instant',inline:'center',block:'nearest'});
}
// Urutan DOM = urutan baca Arab (direction:rtl): elemen pertama ada di paling KANAN.
// Mode 2 halaman: ganjil di kanan, genap di kiri (1|2, 3|4, ...).
function build(){
  loadObs&&loadObs.disconnect();curObs&&curObs.disconnect();
  track.replaceChildren();cells={};loaded.clear();
  const step=spread?2:1,frag=document.createDocumentFragment();
  for(let i=1;i<=T;i+=step){
    const d=document.createElement('div');d.className='pg';d.dataset.p=i;
    // potret: 1 gambar = 1 halaman; landscape: 1 gambar (i,i+1) sudah berisi 2 halaman
    const h=document.createElement('div');h.className='h';h.dataset.p=i;d.appendChild(h);
    cells[i]=d;frag.appendChild(d);
  }
  track.appendChild(frag);
  loadObs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.querySelectorAll('.h').forEach(loadImg)}),{root:track,rootMargin:'0px 100% 0px 100%'});
  curObs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!rz)setCur(+e.target.dataset.p)}),{root:track,threshold:0.6});
  const c=start(cur);
  cells[c].querySelectorAll('.h').forEach(loadImg);
  setCur(c);goto(c,false);
  for(const k in cells){loadObs.observe(cells[k]);curObs.observe(cells[k])}
  requestAnimationFrame(()=>goto(cur,false));
}
build();
mq.addEventListener('change',()=>{spread=mq.matches;build()});
// Ukuran layar berubah (fullscreen masuk/keluar, bilah sistem, rotasi): tahan pergantian halaman aktif sampai ukuran stabil, lalu ratakan ulang sekali
let rt;const hold=()=>{rz=true;clearTimeout(rt);rt=setTimeout(()=>{goto(ftgt||cur,false);requestAnimationFrame(()=>{rz=false;
  // pergantian halaman yang tertahan selama rz tidak pernah dilaporkan observer: sinkronkan 'cur' dengan halaman di tengah layar
  const el=document.elementFromPoint(innerWidth/2,innerHeight/2),pg=el&&el.closest&&el.closest('.pg');if(pg&&+pg.dataset.p!==cur)setCur(+pg.dataset.p)})},200)};
addEventListener('resize',hold);
document.addEventListener('fullscreenchange',hold);

$('sel').onchange=e=>goto(+e.target.value,false);
$('jsel').onchange=e=>goto(C.juzStart[+e.target.value-1],false);
$('ssel').onchange=e=>goto(pageOfAyah(+e.target.value,1),false);

// Tekan lama / seret gambar halaman tidak memunculkan menu bawaan browser
track.addEventListener('contextmenu',e=>e.preventDefault());
track.addEventListener('dragstart',e=>e.preventDefault());
// Ketuk layar -> tampilkan/sembunyikan bilah. Geser halaman tidak memicu ketukan.
let firstTap=true;
track.addEventListener('click',e=>{
  if(e.target.closest('button,select'))return;
  document.body.classList.toggle('ui');
  if(firstTap&&!(matchMedia('(display-mode: fullscreen), (display-mode: standalone), (display-mode: minimal-ui)').matches||navigator.standalone)&&matchMedia('(pointer:coarse)').matches&&document.fullscreenEnabled&&!document.fullscreenElement)
    document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
  firstTap=false;
});
// Panah keyboard: kiri = berikutnya (searah mushaf Arab)
addEventListener('keydown',e=>{
  const st=spread?2:1;
  if(e.key==='ArrowLeft'&&cur+st<=T)goto(cur+st,true);
  if(e.key==='ArrowRight'&&cur-st>=1)goto(cur-st,true);
});
// Menu ⋯, lembar navigasi (ketuk judul), dan perapian bilah
const navSheet=$('nav'),menu=$('menu'),more=$('morebtn');
const setMenu=o=>{menu.hidden=!o;more.setAttribute('aria-expanded',o)};
more.onclick=()=>setMenu(menu.hidden);
menu.addEventListener('click',e=>{if(e.target.closest('button'))setMenu(false)});
// ketukan di luar menu hanya menutup menu, tidak ikut menyembunyikan bilah
document.addEventListener('click',e=>{if(!menu.hidden&&!e.target.closest('#menu,#morebtn')){e.stopPropagation();setMenu(false)}},true);
$('ttl').onclick=()=>{setMenu(false);navSheet.hidden=false};
navSheet.addEventListener('click',e=>{if(e.target===navSheet)navSheet.hidden=true});
['jsel','ssel','sel'].forEach(id=>$(id).addEventListener('change',()=>{navSheet.hidden=true}));
new MutationObserver(()=>{if(!document.body.classList.contains('ui')){setMenu(false);$('dlbox').hidden=true;$('rset').hidden=true;$('rcfg').classList.remove('on')}}).observe(document.body,{attributes:true,attributeFilter:['class']});
addEventListener('keydown',e=>{if(e.key==='Escape'){navSheet.hidden=true;$('ash').hidden=true;$('qs').hidden=true;$('dlbox').hidden=true;setMenu(false)}});
// Tombol kembali perangkat: tutup lapisan yang terbuka (popup ayat, sheet qori/navigasi, kotak unduh, menu) dulu; baru keluar bila tidak ada
(()=>{
  const ovs=[$('ash'),$('qs'),navSheet,$('dlbox'),menu];
  let pushed=false,wait=false;
  const fixUrl=()=>{if(curUrl)history.replaceState(null,'',curUrl)};
  const sync=()=>{
    if(wait)return;
    const o=ovs.some(x=>!x.hidden);
    if(o&&!pushed){history.pushState({ov:1},'');pushed=true}
    else if(!o&&pushed){wait=true;history.back()}
  };
  const mo=new MutationObserver(sync);
  ovs.forEach(x=>mo.observe(x,{attributes:true,attributeFilter:['hidden']}));
  addEventListener('popstate',()=>{
    if(wait){wait=false;pushed=false;fixUrl();sync();return} // entri riwayat dilepas karena lapisan ditutup lewat layar
    if(!pushed)return;
    pushed=false;fixUrl();
    const t=ovs.find(x=>!x.hidden);
    if(t===menu)setMenu(false);else if(t)t.hidden=true;
    sync();
  });
  // tombol kembali kecil: tutup lapisan bila ada, kalau tidak kembali ke halaman sebelumnya (atau beranda)
  $('bk').onclick=()=>{
    if(ovs.some(x=>!x.hidden)||history.length>1){history.back();return}
    location.href='index.html';
  };
})();
if(location.protocol.startsWith('http')&&navigator.serviceWorker)navigator.serviceWorker.register('sw.js');

// Simpan gambar untuk offline per juz (Cache API, bukan localStorage).
// Cache 'mushaf-v1' dan alamat gambar sama persis dengan Kuis Murojaah v3. Status tiap juz dibaca langsung dari cache bersama itu
// (tidak ada catatan terpisah), jadi unduhan di salah satu app langsung terlihat di app satunya.
(()=>{
  const dlb=$('dlbtn'),box=$('dlbox'),grid=$('jg'),txt=$('dltxt'),gob=$('dlgo'),prog=$('dlprog'),sum=$('dlsum'),lab=dlb.querySelector('span');
  if(!window.caches||!location.protocol.startsWith('http')){dlb.hidden=true;return}
  const CN='mushaf-v1',abs=u=>new URL(u,location.href).href,LAB0=lab.textContent;
  // alamat gambar per juz: potret (1 gambar per halaman) + landscape (1 gambar per pasangan halaman); gambar landscape di batas juz dipakai dua juz
  const JU=[];
  for(let j=1;j<=30;j++){
    const a=C.juzStart[j-1]||1,b=j<30?C.juzStart[j]-1:T,st=new Set();
    for(let p=a;p<=b;p++){st.add(abs(src(p,'P')));st.add(abs(src(p,'L')))}
    JU[j]=[...st];
  }
  let have=new Set(),sel=new Set(),run=false,stop=false,raf=0;
  const cnt=j=>{let n=0;for(const u of JU[j])if(have.has(u))n++;return n};
  const done=j=>cnt(j)>=JU[j].length;
  const tiles=[];
  for(let j=1;j<=30;j++){const t=document.createElement('button');t.className='jt';t.textContent=j;t.dataset.j=j;grid.appendChild(t);tiles[j]=t}
  function paint(){
    raf=0;let nd=0,k=0;const miss=new Set();
    for(let j=1;j<=30;j++){

  if(!navigator.mediaDevices||!window.MediaRecorder){note('Browser ini belum mendukung perekaman');return}
  busy=true;stopAudio();window.audHalt&&audHalt();
  tools.hidden=true;fab.disabled=true;rt.hidden=false;rt.textContent='Membuka mikrofon\u2026'; // kunci semua tombol sejak ketukan pertama
  let err=null;
  try{err=await begin()}catch(e){err='Gagal memulai perekaman'}
  busy=false;
  if(err){release();rec=null;resetUI();sync(cur);note(err)}
}
fab.onclick=()=>{if(rec){if(rec.state==='recording')rec.stop()}else start()};

$('rdl').onclick=()=>{

// Kecerahan dalam app: geser ke atas = lebih terang, ke bawah = lebih gelap (lapisan gelap di atas halaman).
// Browser tidak boleh mengubah kecerahan layar perangkat, jadi ini meredupkan tampilan app saja. Disimpan terpisah untuk potret dan landscape.
(()=>{
  const dim=$('dim'),hud=$('bhud'),hv=$('bhv'),hb=$('bhb'),trk=$('track'),oq=matchMedia('(orientation:landscape)');
  const MIN=.2,key=()=>'quran.br.'+(oq.matches?'l':'p');
  let br=1,ht=0,mode=-1,pid=null,sx=0,sy=0,b0=1,until=0;
  const paint=()=>{
    dim.style.opacity=(1-br).toFixed(3);
    hv.textContent=Math.round(br*100)+'%';
    hb.style.setProperty('--v',((br-MIN)/(1-MIN)*100).toFixed(1)+'%');
  };
  const load=()=>{let v=1;try{const x=parseFloat(localStorage.getItem(key()));if(x>=MIN&&x<=1)v=x}catch(e){}br=v;paint()};
  const save=()=>{try{localStorage.setItem(key(),br.toFixed(3))}catch(e){}};
  const show=()=>{hud.classList.add('on');clearTimeout(ht);ht=setTimeout(()=>hud.classList.remove('on'),1000)};
  trk.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse')return;
    if(!e.isPrimary){mode=-1;return} // jari kedua (mis. cubit): batalkan
    pid=e.pointerId;sx=e.clientX;sy=e.clientY;b0=br;mode=0;
  });
  trk.addEventListener('pointermove',e=>{
    if(e.pointerId!==pid||mode<0)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(mode===0){
      if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
      mode=Math.abs(dy)>Math.abs(dx)*1.4?2:-1; // 2 = geser vertikal (kecerahan); -1 = geser halaman, biarkan
      if(mode!==2)return;
      try{trk.setPointerCapture(e.pointerId)}catch(x){}
    }
    // satu rentang penuh (20%-100%) = geser setinggi 60% layar
    br=Math.max(MIN,Math.min(1,b0-dy/(innerHeight*.6)*(1-MIN)));
    paint();show();
  });
  const end=e=>{
    if(e.pointerId!==pid)return;
    if(mode===2){save();until=Date.now()+400}
    mode=-1;pid=null;
  };
  trk.addEventListener('pointerup',end);trk.addEventListener('pointercancel',end);
  // geser vertikal tidak ikut dihitung sebagai ketukan (menampilkan bilah / memutar ayat)
  trk.addEventListener('click',e=>{if(Date.now()<until){e.stopPropagation();e.preventDefault()}},true);
  oq.addEventListener('change',load);
  load();
})();

  try{if(navigator.share){await navigator.share({title:tx,text:tx,url:u});return}}catch(x){if(x&&x.name==='AbortError')return}
  try{await navigator.clipboard.writeText(tx+'\n'+u);toast('Tautan disalin')}catch(x){toast('Tidak bisa membagikan')}
};

// ---------- pengaturan ----------
const rsS=$('rs_s'),rsA=$('rs_a'),reS=$('re_s'),reA=$('re_a');
SN.forEach((n,i)=>{rsS.add(new Option((i+1)+'. '+n,i+1));reS.add(new Option((i+1)+'. '+n,i+1))});
function fillA(sel,s){const n=C.ay[s-1];if(sel.options.length!==n){sel.replaceChildren();for(let a=1;a<=n;a++)sel.add(new Option(a,a))}}
function paintRange(){
  const[s1,a1]=sa(S.rs),[s2,a2]=sa(S.re);
  rsS.value=s1;fillA(rsA,s1);rsA.value=a1;reS.value=s2;fillA(reA,s2);reA.value=a2;
  $('arng').checked=S.rng;$('arb').hidden=!S.rng;
}
function paintRep(){document.querySelectorAll('#arep button').forEach(b=>b.classList.toggle('on',+b.dataset.r===S.rep));document.querySelectorAll('#arr button').forEach(b=>b.classList.toggle('on',+b.dataset.r===S.rr))}
// Ganti SURAT: awal = ayat 1 surat itu, akhir = ayat terakhir surat itu (bukan ayat 1, supaya tidak menyeret sisi lain).
// Jika sisi yang lain jadi terbalik, sisi itu dipindah ke batas surat (bukan ke satu ayat yang sama).
const lastOf=s=>gk(s,C.ay[s-1]);
function setRange(edit,g0,bySurat){
  if(edit==='s'){S.rs=g0;if(S.re<S.rs)S.re=bySurat?lastOf(surahOf(S.rs)):S.rs}
  else{S.re=g0;if(S.rs>S.re)S.rs=bySurat?gk(surahOf(S.re),1):S.re}
  save();paintRange();paintPlay();
}
rsS.onchange=()=>setRange('s',gk(+rsS.value,1),true);
rsA.onchange=()=>setRange('s',gk(+rsS.value,+rsA.value));
reS.onchange=()=>setRange('e',lastOf(+reS.value),true);
reA.onchange=()=>setRange('e',gk(+reS.value,+reA.value));
$('arng').onchange=e=>{S.rng=e.target.checked;save();paintRange();paintPlay()};
$('apg').onclick=()=>{
  const nxt=(spread&&cur<T)?cur+1:cur;
  S.rs=C.ps[cur-1]||1;S.re=Math.max(S.rs,(nxt<T?C.ps[nxt]:TA+1)-1);S.rng=true;save();paintRange();paintPlay();
};
document.querySelectorAll('#arep button').forEach(b=>b.onclick=()=>{
  S.rep=+b.dataset.r;if(act){A.loop=S.rep===0&&!pre;label()}save();paintRep();
});
$('abs').checked=S.bs;$('abs').onchange=e=>{S.bs=e.target.checked;save()};
document.querySelectorAll('#arr button').forEach(b=>b.onclick=()=>{S.rr=+b.dataset.r;save();paintRep();label()});
$('aopt').onclick=()=>{const a=$('aset');a.hidden=!a.hidden;$('aopt').classList.toggle('on',!a.hidden)};

// ---------- qori: daftar pilihan + simpan offline per juz ----------
const qb=$('qbtn'),qs=$('qs'),ql=$('ql');let off=false;
qb.innerHTML=svg('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>')+'<span></span>';
function paintQ(){
  qb.querySelector('span').textContent='Qori: '+cq().n;
  ql.replaceChildren(...RC.map(r=>{const b=document.createElement('button');b.className='row'+(r.id===S.q?' on':'');b.disabled=!r.d;
    b.textContent=r.n+(r.d?(r.id===S.q?'  \u2713':''):' (belum tersedia)');
    b.onclick=()=>{S.q=r.id;save();paintQ();label();$('qst').textContent='';if(act)load(g)};return b}));
}
qb.onclick=()=>{paintQ();qs.hidden=false};
qs.addEventListener('click',e=>{if(e.target===qs)qs.hidden=true});
// Simpan audio offline: pilih banyak juz sekaligus untuk qori yang sedang dipilih (cache 'mushaf-audio-v1', sama dengan cache otomatis)
const adb=$('adbox'),ajg=$('ajg'),atxt=$('atxt'),ago=$('ago'),aprog=$('aprog'),asum=$('asum'),atl=$('atl'),atiles=[];
let asel=new Set(),arun=false,astop=false,araf=0,AJ=null,AJk='',aq0=null;
for(let j=1;j<=30;j++){const t=document.createElement('button');t.className='jt';t.textContent=j;t.dataset.j=j;ajg.appendChild(t);atiles[j]=t}
function ajuz(){ // alamat audio per juz untuk qori terpilih (+ basmalah bila dipakai)
  const k=S.q+'|'+(S.bs?1:0);if(AJ&&AJk===k)return AJ;
  const R=[];
  for(let j=1;j<=30;j++){
    const g0=C.ps[C.juzStart[j-1]-1]||1,g1=j<30?C.ps[C.juzStart[j]-1]-1:TA,st=new Set();let nb=false;
    for(let x=g0;x<=g1;x++){st.add(url(x));const[s,a]=sa(x);if(a===1&&s!==1&&s!==9)nb=true}
    if(S.bs&&nb)st.add(url(1));
    R[j]=[...st];
  }
  AJ=R;AJk=k;return R;
}
const acnt=j=>{let n=0;for(const u of ajuz()[j])if(have.has(u))n++;return n};
const adone=j=>acnt(j)>=ajuz()[j].length;
function apaint(){
  araf=0;const J=ajuz();let nd=0,k=0;const miss=new Set();
  for(let j=1;j<=30;j++){
    const n=acnt(j),N=J[j].length,d=n>=N,on=asel.has(j)&&!d,t=atiles[j];
    if(d)nd++;
    if(on){k++;for(const u of J[j])if(!have.has(u))miss.add(u)}
    t.classList.toggle('done',d);t.classList.toggle('sel',on);
    t.style.setProperty('--p',(n/N).toFixed(3));
    t.setAttribute('aria-pressed',on);t.setAttribute('aria-disabled',d||arun);
    t.setAttribute('aria-label','Juz '+j+', '+(d?'sudah tersimpan':n?n+' dari '+N+' ayat tersimpan':'belum tersimpan'));
  }
  asum.textContent=nd+'/30 juz';
  if(!arun){ago.disabled=!k;ago.textContent=k?'Unduh '+k+' juz \u00b7 '+miss.size+' ayat':nd===30?'Semua juz sudah tersimpan':'Pilih juz dulu'}
}
const apaintSoon=()=>{if(!araf)araf=requestAnimationFrame(apaint)};
async function astart(){
  const order=[...asel].filter(j=>!adone(j)).sort((a,b)=>a-b);if(!order.length)return;
  const J=ajuz(),todo=[],seen=new Set();
  for(const j of order)for(const u of J[j])if(!have.has(u)&&!seen.has(u)){seen.add(u);todo.push(u)}
  const N=todo.length;if(!N){apaint();return}
  try{if(qk(todo[0]))await qdb();else await caches.open(AC)}catch(e){atxt.textContent='Penyimpanan tidak bisa dibuka';return}
  arun=true;astop=false;ago.disabled=false;ago.textContent='Berhenti';aprog.hidden=false;apaint();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  let n=0,f=0,streak=0,i=0;
  const upd=()=>{aprog.style.setProperty('--v',(n/N).toFixed(3));atxt.textContent='Mengunduh '+n+' / '+N+' ayat'+(f?' \u00b7 '+f+' gagal':'');apaintSoon()};
  upd();
  const w=async()=>{while(!astop&&streak<8&&i<todo.length){const u=todo[i++];
    try{const r=await fetch(u,{mode:'cors'});if(!r.ok)throw 0;await sput(u,r);have.add(u);n++;streak=0}catch(e){f++;streak++}
    upd()}};
  await Promise.all([w(),w(),w(),w()]);
  arun=false;aprog.hidden=true;apaint();
  atxt.textContent=n>=N?'Selesai, '+order.length+' juz tersimpan':streak>=8?'Gagal berulang (koneksi atau penyimpanan penuh). Juz yang belum lengkap tetap terpilih.':astop?'Dihentikan. Yang sudah tersimpan tetap ada.':n+' tersimpan, '+f+' gagal. Juz yang belum lengkap tetap terpilih.';
}
async function aidle(){ // sama seperti lembar juz gambar: keterangan pemakaian bersama + ukuran terpakai
  if(arun)return;
  let mb='';
  try{const e=await navigator.storage.estimate();if(e&&e.usage>1048576)mb='terpakai \u00b1'+Math.round(e.usage/1048576)+' MB'}catch(x){}
  const t=[cq().qb?'Dipakai juga oleh app Kuis Murojaah':'',mb].filter(Boolean).join(' \u00b7 ');
  if(!arun)atxt.textContent=t;
}
ajg.onclick=e=>{const t=e.target.closest('.jt');if(!t||arun)return;const j=+t.dataset.j;if(adone(j))return;asel.has(j)?asel.delete(j):asel.add(j);apaint()};
$('aall').onclick=()=>{if(arun)return;for(let j=1;j<=30;j++)if(!adone(j))asel.add(j);apaint()};
$('anone').onclick=()=>{if(arun)return;asel.clear();apaint()};
ago.onclick=()=>arun?(astop=true):astart();
adb.addEventListener('click',e=>{if(e.target===adb)adb.hidden=true});
$('qoff').onclick=async()=>{
  const st=$('qst');
  if(!okFor(url(1))){st.textContent='Perlu dibuka lewat alamat web (https)';return}
  if(!arun){
    try{await refreshHave()}catch(e){}
    if(aq0!==S.q){asel.clear();aq0=S.q;atxt.textContent=''}
    if(!asel.size){const j=juzOf(cur);if(!adone(j))asel.add(j)}
    aidle();
  }
  apaint();qs.hidden=true;adb.hidden=false;
};
// pemutar mengambang naik di atas bilah bawah saat bilah muncul
if(window.ResizeObserver){new ResizeObserver(()=>document.documentElement.style.setProperty('--bh',$('bot').offsetHeight+'px')).observe($('bot'))}
paintQ();paintRange();paintRep();paintPlay();label();
})();
</script></body></html>
