<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E4A3B">
<title>Mushaf</title>
<style>
:root{--bg:#F2F1E7;--surface:#FBFAF4;--ink:#10231D;--muted:#586C63;--line:#DBDED0;--primary:#0E4A3B;--on:#F8F5E8;--gold:#EDE1BC;--goldink:#7A5D12}
@media(prefers-color-scheme:dark){:root{--bg:#0A1512;--surface:#101F1A;--ink:#ECE8D8;--muted:#9DB0A6;--line:#203429;--primary:#1F7A60;--on:#F4F1E4;--gold:#3A3219;--goldink:#D9B96B}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,select{font:600 13.5px system-ui,sans-serif;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 12px}
h1{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header select{min-width:0;max-width:30vw;padding:9px 6px}
.pill{background:var(--gold);color:var(--goldink);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600}
#bmbtn{flex:none;padding:8px;display:grid;place-items:center}
#bmbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;display:block}
#bmbtn.on{color:var(--goldink);border-color:var(--gold);background:var(--gold)}
#bmbtn.on svg{fill:var(--goldink);stroke:var(--goldink)}
/* Bilah disembunyikan; muncul saat layar diketuk */
header,#ind{position:fixed;left:0;right:0;z-index:5;background:var(--surface);opacity:0;pointer-events:none;transition:transform .22s ease,opacity .22s ease}
header{top:0;transform:translateY(-100%);display:flex;direction:rtl;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
#ind{bottom:0;transform:translateY(100%);text-align:center;font-size:12.5px;font-weight:600;color:var(--muted);border-top:1px solid var(--line);padding:5px 0 calc(5px + env(safe-area-inset-bottom,0px))}
body.ui header,body.ui #ind{transform:none;opacity:1;pointer-events:auto}
#track{position:fixed;inset:0;display:flex;direction:rtl;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
#track::-webkit-scrollbar{display:none}
.pg{background:#FDFCF5;flex:0 0 100%;width:100%;height:100%;position:relative;scroll-snap-align:center;scroll-snap-stop:always;display:flex;direction:rtl;text-align:center;color:var(--muted);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.h{flex:1 1 0;min-width:0;height:100%;display:flex;align-items:center;justify-content:center}
.h img{width:auto;height:100%;max-width:100%;object-fit:contain;-webkit-mask-image:linear-gradient(90deg,transparent,#000 2.5%,#000 97.5%,transparent);mask-image:linear-gradient(90deg,transparent,#000 2.5%,#000 97.5%,transparent)}
.sp::after{content:"";position:absolute;top:0;bottom:0;left:calc(50% - min(9vw,130px));width:min(18vw,260px);pointer-events:none;background:linear-gradient(90deg,transparent,rgba(0,0,0,.16) 50%,transparent)}
.msg{max-width:340px;padding:0 16px;direction:ltr}
#homebtn{flex:none;padding:8px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}
#homebtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
#dlbtn{flex:none;padding:8px;display:grid;place-items:center}
#dlbtn[hidden]{display:none}
#dlbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
#dlbox{position:fixed;z-index:6;left:12px;right:12px;top:calc(62px + env(safe-area-inset-top,0px));max-width:360px;margin-inline:auto;direction:ltr;text-align:left;display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#dlbox[hidden],body:not(.ui) #dlbox{display:none}
#dlbar{width:100%;accent-color:var(--primary)}
#dlgo{background:var(--primary);color:var(--on);border-color:var(--primary)}
</style></head><body>
<header>
  <a id="homebtn" href="index.html" aria-label="Kembali ke halaman awal"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5 10v10h5v-6h4v6h5V10"/></svg></a>
  <h1 id="ttl">Juz 1</h1><span class="pill" id="info" hidden></span>
  <button id="bmbtn" aria-label="Tandai halaman ini"><svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></svg></button>
  <button id="dlbtn" aria-label="Simpan untuk offline"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg></button>
  <select id="jsel" aria-label="Juz"></select>
  <select id="ssel" aria-label="Surat"></select>
  <select id="sel" aria-label="Halaman"></select>
</header>
<main id="track"></main>
<div id="ind"></div>
<div id="dlbox" hidden><div id="dltxt">Memeriksa…</div><progress id="dlbar" value="0"></progress><button id="dlgo">Unduh semua halaman</button></div>
<script src="config.js"></script>
<script>
const C=CFG,$=id=>document.getElementById(id),T=C.total,src=C.src;
const juzOf=p=>{for(let j=29;j>=0;j--)if(p>=C.juzStart[j])return j+1;return 1};
function pageOfAyah(s,a){
  const g=C.ay.slice(0,s-1).reduce((x,y)=>x+y,0)+a;let lo=0,hi=T-1;
  while(lo<hi){const m=(lo+hi+1)>>1;if(C.ps[m]<=g)lo=m;else hi=m-1}
  return lo+1;
}
const q=new URLSearchParams(location.search),s=+q.get('s'),a=+q.get('a');
const ayahPage=s&&a?pageOfAyah(s,a):0;
let cur=Math.min(Math.max(ayahPage||+q.get('p')||1,1),T);
if(ayahPage){$('info').textContent='QS '+s+':'+a;$('info').hidden=false}
const SN="Al-Fatihah|Al-Baqarah|Ali 'Imran|An-Nisa'|Al-Ma'idah|Al-An'am|Al-A'raf|Al-Anfal|At-Taubah|Yunus|Hud|Yusuf|Ar-Ra'd|Ibrahim|Al-Hijr|An-Nahl|Al-Isra'|Al-Kahfi|Maryam|Taha|Al-Anbiya'|Al-Hajj|Al-Mu'minun|An-Nur|Al-Furqan|Asy-Syu'ara'|An-Naml|Al-Qasas|Al-'Ankabut|Ar-Rum|Luqman|As-Sajdah|Al-Ahzab|Saba'|Fatir|Yasin|As-Saffat|Sad|Az-Zumar|Gafir|Fussilat|Asy-Syura|Az-Zukhruf|Ad-Dukhan|Al-Jasiyah|Al-Ahqaf|Muhammad|Al-Fath|Al-Hujurat|Qaf|Az-Zariyat|At-Tur|An-Najm|Al-Qamar|Ar-Rahman|Al-Waqi'ah|Al-Hadid|Al-Mujadalah|Al-Hasyr|Al-Mumtahanah|As-Saff|Al-Jumu'ah|Al-Munafiqun|At-Tagabun|At-Talaq|At-Tahrim|Al-Mulk|Al-Qalam|Al-Haqqah|Al-Ma'arij|Nuh|Al-Jinn|Al-Muzzammil|Al-Muddassir|Al-Qiyamah|Al-Insan|Al-Mursalat|An-Naba'|An-Nazi'at|'Abasa|At-Takwir|Al-Infitar|Al-Mutaffifin|Al-Insyiqaq|Al-Buruj|At-Tariq|Al-A'la|Al-Gasyiyah|Al-Fajr|Al-Balad|Asy-Syams|Al-Lail|Ad-Duha|Asy-Syarh|At-Tin|Al-'Alaq|Al-Qadr|Al-Bayyinah|Az-Zalzalah|Al-'Adiyat|Al-Qari'ah|At-Takasur|Al-'Asr|Al-Humazah|Al-Fil|Quraisy|Al-Ma'un|Al-Kausar|Al-Kafirun|An-Nasr|Al-Lahab|Al-Ikhlas|Al-Falaq|An-Nas".split('|');
// cum[i] = jumlah ayat sebelum surat ke-(i+1); dipakai memetakan nomor ayat global -> surat
const cum=[];C.ay.reduce((x,y,i)=>(cum[i]=x,x+y),0);
const TA=C.ay.reduce((x,y)=>x+y,0);
const surahOf=g=>{let lo=0,hi=C.ay.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(cum[m]<g)lo=m;else hi=m-1}return lo+1};
for(let j=1;j<=30;j++)$('jsel').add(new Option('Juz '+j,j));
SN.forEach((n,i)=>$('ssel').add(new Option((i+1)+'. '+n,i+1)));
for(let i=1;i<=T;i++)$('sel').add(new Option('Hal. '+i,i));

const track=$('track'),mq=matchMedia('(orientation:landscape) and (min-width:600px)');
let spread=mq.matches,cells={},loaded=new Set(),loadObs,curObs;
const start=n=>spread?(n%2?n:n-1):n;

function loadImg(h){
  if(h.dataset.done)return;h.dataset.done=1;loaded.add(h);const n=+h.dataset.p;
  const im=new Image();im.alt='Halaman '+n;
  im.onerror=()=>{h.innerHTML='<div class="msg">Gambar halaman '+n+' tidak ditemukan.<br>Yang dicari: <code dir="ltr">'+src(n)+'</code><br>Cocokkan nama folder dan file di repo dengan <code dir="ltr">config.js</code>, atau kalau sedang offline, halaman ini belum tersimpan di perangkat</div>'};
  const u=src(n);try{if(new URL(u,location.href).origin!==location.origin)im.crossOrigin='anonymous'}catch(e){}
  im.src=u;h.appendChild(im);
}
// buang gambar yang sudah jauh dari halaman aktif supaya memori tidak menumpuk
function unloadFar(){loaded.forEach(h=>{if(Math.abs(+h.dataset.p-cur)>12){h.replaceChildren();delete h.dataset.done;loaded.delete(h)}})}
// Penanda (bookmark) & posisi terakhir dibaca — disimpan di localStorage,
// dipakai bersama oleh index.html (tab PENANDA, tombol "Lanjut membaca").
const bm=()=>{try{return JSON.parse(localStorage.getItem('quran.bm')||'[]')}catch(e){return[]}};
const saveBm=a=>{try{localStorage.setItem('quran.bm',JSON.stringify(a))}catch(e){}};
function syncBm(n){$('bmbtn').classList.toggle('on',bm().includes(n))}
$('bmbtn').onclick=()=>{
  const a=bm(),i=a.indexOf(cur);
  if(i>-1)a.splice(i,1);else a.push(cur);
  saveBm(a);syncBm(cur);
};
function setCur(n){
  cur=n;$('sel').value=n;
  const j=juzOf(n);$('jsel').value=j;$('ttl').textContent='Juz '+j;
  // surat yang tampil di halaman aktif; pilihan pengguna dipertahankan bila masih ada di halaman ini
  const e=spread&&n<T?n+1:n,s1=surahOf(C.ps[n-1]),s2=surahOf(e<T?C.ps[e]-1:TA),sv=+$('ssel').value;
  $('ssel').value=(sv>=s1&&sv<=s2)?sv:s1;
  $('ind').textContent='Hal. '+(spread&&n<T?n+'–'+(n+1):n)+' / '+T;
  const hasAyah=ayahPage&&(ayahPage===n||(spread&&ayahPage===n+1));
  history.replaceState(null,'','?p='+n+(hasAyah?'&s='+s+'&a='+a:''));
  try{localStorage.setItem('quran.last',n)}catch(e){}
  syncBm(n);
  unloadFar();
}
function goto(n,smooth){
  const c=cells[start(n)];
  if(c)c.scrollIntoView({behavior:smooth?'smooth':'instant',inline:'center',block:'nearest'});
}
// Urutan DOM = urutan baca Arab (direction:rtl): elemen pertama ada di paling KANAN.
// Mode 2 halaman: ganjil di kanan, genap di kiri (1|2, 3|4, ...).
function build(){
  loadObs&&loadObs.disconnect();curObs&&curObs.disconnect();
  track.replaceChildren();cells={};loaded.clear();
  const step=spread?2:1,frag=document.createDocumentFragment();
  for(let i=1;i<=T;i+=step){
    const d=document.createElement('div');d.className='pg'+(spread?' sp':'');d.dataset.p=i;
    for(let n=i;n<i+step&&n<=T;n++){const h=document.createElement('div');h.className='h';h.dataset.p=n;d.appendChild(h)}
    cells[i]=d;frag.appendChild(d);
  }
  track.appendChild(frag);
  loadObs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.querySelectorAll('.h').forEach(loadImg)}),{root:track,rootMargin:'0px 100% 0px 100%'});
  curObs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setCur(+e.target.dataset.p)}),{root:track,threshold:0.6});
  const c=start(cur);
  cells[c].querySelectorAll('.h').forEach(loadImg);
  setCur(c);goto(c,false);
  for(const k in cells){loadObs.observe(cells[k]);curObs.observe(cells[k])}
  requestAnimationFrame(()=>goto(cur,false));
}
build();
mq.addEventListener('change',()=>{spread=mq.matches;build()});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>goto(cur,false),150)});

$('sel').onchange=e=>goto(+e.target.value,false);
$('jsel').onchange=e=>goto(C.juzStart[+e.target.value-1],false);
$('ssel').onchange=e=>goto(pageOfAyah(+e.target.value,1),false);

// Ketuk layar -> tampilkan/sembunyikan bilah. Geser halaman tidak memicu ketukan.
let firstTap=true;
track.addEventListener('click',e=>{
  if(e.target.closest('button,select'))return;
  document.body.classList.toggle('ui');
  if(firstTap&&matchMedia('(pointer:coarse)').matches&&document.fullscreenEnabled&&!document.fullscreenElement)
    document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
  firstTap=false;
});
// Panah keyboard: kiri = berikutnya (searah mushaf Arab)
addEventListener('keydown',e=>{
  const st=spread?2:1;
  if(e.key==='ArrowLeft'&&cur+st<=T)goto(cur+st,true);
  if(e.key==='ArrowRight'&&cur-st>=1)goto(cur-st,true);
});
if(location.protocol.startsWith('http')&&navigator.serviceWorker)navigator.serviceWorker.register('sw.js');

// Simpan semua halaman untuk offline (Cache API, bukan localStorage)
(()=>{
  const dlb=$('dlbtn'),box=$('dlbox'),bar=$('dlbar'),txt=$('dltxt'),gob=$('dlgo');
  if(!window.caches||!location.protocol.startsWith('http')){dlb.hidden=true;return}
  const CN='quran-v2',abs=n=>new URL(src(n),location.href).href;
  bar.max=T;let run=false,stop=false;
  async function missing(c){
    const set=new Set((await c.keys()).map(r=>r.url)),m=[];
    for(let i=1;i<=T;i++){const u=abs(i);if(!set.has(u))m.push(u)}
    return m;
  }
  async function refresh(){
    if(run)return;
    const n=T-(await missing(await caches.open(CN))).length;
    bar.value=n;
    txt.textContent=n>=T?'Semua '+T+' halaman sudah tersimpan. Bisa dibaca tanpa internet.':n+' / '+T+' halaman tersimpan di perangkat.';
    gob.textContent=n>=T?'Periksa lagi':(n?'Lanjutkan unduh':'Unduh semua halaman');
  }
  async function start(){
    run=true;stop=false;gob.textContent='Berhenti';
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
    const c=await caches.open(CN),todo=await missing(c);
    let done=T-todo.length,fail=0,streak=0,i=0;
    const upd=()=>{bar.value=done;txt.textContent=done+' / '+T+' halaman tersimpan'+(fail?' · '+fail+' gagal':'')};
    upd();
    const w=async()=>{
      while(!stop&&streak<8&&i<todo.length){
        const u=todo[i++];
        try{const r=await fetch(u,{mode:'cors'});if(!r.ok)throw 0;await c.put(u,r);done++;streak=0}
        catch(e){fail++;streak++}
        upd();
      }
    };
    await Promise.all([w(),w(),w(),w()]);
    run=false;const left=T-done;
    txt.textContent=left?done+' / '+T+' tersimpan. '+(streak>=8?'Ada yang gagal (koneksi atau penyimpanan penuh).':'Dihentikan.')+' Tekan lanjutkan.':'Selesai! Semua '+T+' halaman tersimpan.';
    gob.textContent=left?'Lanjutkan unduh':'Periksa lagi';
  }
  dlb.onclick=()=>{box.hidden=!box.hidden;if(!box.hidden)refresh()};
  gob.onclick=()=>run?(stop=true):start();
})();
</script></body></html>
