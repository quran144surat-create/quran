<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E4A3B">
<title>Download Mushaf per Juz</title>
<style>
:root{--bg:#F2F1E7;--surface:#FBFAF4;--ink:#10231D;--muted:#586C63;--line:#DBDED0;--primary:#0E4A3B;--on:#F8F5E8;--em:#17705A;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0A1512;--surface:#101F1A;--ink:#ECE8D8;--muted:#9DB0A6;--line:#203429;--primary:#1F7A60;--on:#F4F1E4;--em:#3FA88B}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}.muted{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px}
.row b{flex:1}.row small{display:block;color:var(--muted);font-weight:400}
button{font:600 13px system-ui;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px}
button.p{background:var(--primary);color:var(--on);border-color:var(--primary)}
button:disabled{opacity:.5}
.bar{height:4px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;width:0;background:var(--em)}
</style></head><body><div class="wrap">
<h1>Download Mushaf per Juz</h1>
<p class="muted" id="est">Halaman disimpan di penyimpanan browser (bukan localStorage) dan bisa dibaca offline.</p>
<div style="display:flex;gap:8px"><button class="p" id="all">Unduh semua juz</button><button id="back">‹ Kembali</button></div>
<div id="list"></div></div>
<script src="config.js"></script>
<script>
const C=CFG, NAME='mushaf-v1', $=id=>document.getElementById(id);
const src=C.src;
const rng=j=>[C.juzStart[j-1], j<30?C.juzStart[j]-1:C.total];
let busy=false;
async function count(j){const c=await caches.open(NAME),[s,e]=rng(j);let n=0;
  for(let p=s;p<=e;p++)if(await c.match(src(p)))n++;return [n,e-s+1]}
async function refresh(j){const [n,t]=await count(j),r=$('r'+j);
  r.querySelector('small').textContent=n===t?'✓ Lengkap · '+t+' halaman':n+' / '+t+' halaman';
  r.querySelector('.d').textContent=n===t?'Terunduh':'Unduh';r.querySelector('.d').disabled=n===t;
  r.querySelector('.x').hidden=!n; r.querySelector('.bar i').style.width=(n/t*100)+'%'}
async function unduh(j){
  const c=await caches.open(NAME),[s,e]=rng(j),bar=$('r'+j).querySelector('.bar i');
  for(let p=s;p<=e;p+=5){
    const us=[];for(let q=p;q<=Math.min(p+4,e);q++)us.push(src(q));
    await Promise.all(us.map(async u=>{if(!await c.match(u))await c.add(u)}));
    bar.style.width=((Math.min(p+4,e)-s+1)/(e-s+1)*100)+'%';
  }
  await refresh(j);
}
async function hapus(j){const c=await caches.open(NAME),[s,e]=rng(j);
  for(let p=s;p<=e;p++)await c.delete(src(p));await refresh(j)}
async function estimate(){if(navigator.storage&&navigator.storage.estimate){const x=await navigator.storage.estimate();
  $('est').textContent='Terpakai ±'+(x.usage/1048576).toFixed(0)+' MB (di penyimpanan browser, bukan localStorage).'}}
for(let j=1;j<=30;j++){
  const r=document.createElement('div');r.className='row';r.id='r'+j;
  r.innerHTML='<div style="flex:1"><b>Juz '+j+'</b><small></small><div class="bar"><i></i></div></div><button class="d p"></button><button class="x" hidden>Hapus</button>';
  r.querySelector('.d').onclick=async()=>{if(busy)return;busy=true;try{await unduh(j)}catch(e){r.querySelector('small').textContent='Gagal (cek koneksi)'}busy=false;estimate()};
  r.querySelector('.x').onclick=async()=>{await hapus(j);estimate()};
  $('list').appendChild(r);refresh(j);
}
$('all').onclick=async()=>{if(busy)return;busy=true;$('all').disabled=true;
  try{for(let j=1;j<=30;j++)await unduh(j)}catch(e){$('est').textContent='Terhenti. Coba lagi saat koneksi stabil.'}
  busy=false;$('all').disabled=false;estimate()};
$('back').onclick=()=>document.referrer?history.back():location.href='index.html';
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
estimate();
location.protocol.startsWith('http')&&navigator.serviceWorker&&navigator.serviceWorker.register('sw.js');
</script></body></html>
